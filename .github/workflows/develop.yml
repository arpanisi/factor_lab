name: Develop CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

jobs:
  fast-tests:
    name: Lint & Fast Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy scipy pyarrow PyYAML omegaconf antlr4-python3-runtime datasets pytest ruff

      - name: Run linter
        run: ruff check .

      - name: Run fast-tier tests
        run: PYTHONPATH=. pytest tests/
